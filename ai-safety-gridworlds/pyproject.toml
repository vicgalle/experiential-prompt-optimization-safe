[project]
name = "ai-safety-gridworlds"
version = "1.5"
description = "A suite of reinforcement learning environments illustrating various safety properties of intelligent agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "DeepMind" }
]
keywords = ["reinforcement-learning", "ai-safety", "gridworld", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "absl-py",
    "numpy>=1.20",
    "pycolab",
]

[project.urls]
Homepage = "https://github.com/deepmind/ai-safety-gridworlds"
Repository = "https://github.com/deepmind/ai-safety-gridworlds"
Paper = "https://arxiv.org/pdf/1711.09883.pdf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_safety_gridworlds"]
