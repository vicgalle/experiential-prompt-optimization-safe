[project]
name = "epo-safe"
version = "0.1.0"
description = "Experiential Prompt Optimization for Safe Agents"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "ai-safety-gridworlds",
    "pycolab",
    "numpy<2.0",
    "absl-py",
    "pandas",
    "matplotlib",
    "seaborn",
    "anyio",
    "google-genai",
    "openai",
]

[tool.uv.sources]
ai-safety-gridworlds = { path = "ai-safety-gridworlds", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epo_safe"]
